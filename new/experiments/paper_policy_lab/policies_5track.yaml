run_defaults:
  python: /opt/anaconda3/envs/elephant/bin/python
  repo_root: /Users/jangjaewon/Desktop/Elephant_Lab
  bundle_id: BUNDLE-20260521-POSTCLOSE
  registry_dir: artifacts/lgbm_paper_candidate/BUNDLE-20260521-POSTCLOSE
  tickers: 005930,000660,042700,403870,058470
  cycles: 60
  interval_sec: 60
  end_date: "20260521"
  business_days: 253
  confirm_phrase: PAPER_AUTO_OK
  prelive_required: true
  max_tickers: 30
  max_parallel: 5

policies:
  - id: MAIN_BASELINE
    label: 기준 정책
    mode: paper
    profile_prefix: KIS_MAIN
    description: 현재 승인된 paper-auto 정책을 그대로 쓰는 기준선입니다.
    overrides:
      max_orders_per_cycle: 3
      max_order_qty_per_order: 1
      ppo_max_names: 10
      ppo_min_cash: 0.10
      ppo_min_confidence: 0.03
      ppo_weighting: score
      trade_probability_gate_enabled: false

  - id: SAFE_SLOW
    label: 보수 정책
    mode: paper
    profile_prefix: KIS_SAFE
    description: 주문 수와 비중을 줄여 체결/리스크 안정성을 보는 정책입니다.
    overrides:
      max_orders_per_cycle: 1
      max_order_qty_per_order: 1
      ppo_max_names: 5
      ppo_min_cash: 0.20
      ppo_min_confidence: 0.06
      ppo_weighting: score
      trade_probability_gate_enabled: false

  - id: ACTIVE_SMALL
    label: 적극 소량 정책
    mode: paper
    profile_prefix: KIS_ACTIVE
    description: 동일 모델에서 더 많은 기회를 허용하되 주문 수량은 1주로 제한합니다.
    overrides:
      max_orders_per_cycle: 3
      max_order_qty_per_order: 1
      ppo_max_names: 12
      ppo_min_cash: 0.05
      ppo_min_confidence: 0.015
      ppo_weighting: score
      trade_probability_gate_enabled: false

  - id: TOPK_EQUAL
    label: Top-K 균등 정책
    mode: paper
    profile_prefix: KIS_TOPK
    description: PPO 비중 대신 Top-K 균등 비중으로 실제 paper 주문을 비교하는 정책입니다.
    overrides:
      max_orders_per_cycle: 3
      max_order_qty_per_order: 1
      ppo_max_names: 10
      ppo_min_cash: 0.10
      ppo_min_confidence: 0.03
      ppo_weighting: equal
      trade_probability_gate_enabled: false

  - id: STRICT_GATE
    label: 엄격 게이트 정책
    mode: shadow
    profile_prefix: KIS_STRICT
    description: 더 강한 confidence/trade-probability gate를 shadow로 진단합니다. 2026-05-24 replay에서 0.35는 후보 22%를 거르고 주문이 남았지만 pass 1/8에 그쳐 첫날 paper 주문 트랙에서는 제외합니다.
    overrides:
      max_orders_per_cycle: 2
      max_order_qty_per_order: 1
      ppo_max_names: 7
      ppo_min_cash: 0.15
      ppo_min_confidence: 0.06
      ppo_weighting: score
      trade_probability_gate_enabled: true
      min_trade_probability: 0.35
