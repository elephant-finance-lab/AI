# S0-6 추가 — Rate Limiter 소스별 Token bucket 파라미터
# req_per_sec: 초당 토큰 보충량 (refill rate)
# burst: 버킷 최대 용량 (최대 순간 요청 수)
# 참조 출처: connector_design.md 방법론 3 + KIS/DART/Naver 공식 제한 문서
rate_limits:
  kis_rest:
    req_per_sec: 20
    burst: 50
  kis_ws:
    req_per_sec: 1        # WebSocket은 연결 단위
    burst: 1
  dart:
    req_per_sec: 5
    burst: 10
  krx_investor_flow:
    req_per_sec: 3
    burst: 5
  naver:
    req_per_sec: 10
    burst: 20
  ecos:
    req_per_sec: 2
    burst: 5
  community:
    req_per_sec: 0.1      # 10초당 1회 (5분 폴링 대비 안전)
    burst: 3
  us_market:
    req_per_sec: 1
    burst: 2

# 커넥터 공통 네트워크 정책 (dart/krx/naver/ecos/us_market 공통)
# 불변 원칙 5 (하드코딩 금지): timeout/retry/backoff 수치는 반드시 여기서 로드.
# 적용 파일: src/connectors/*_rest.py
connector_defaults:
  timeout_sec: 10       # HTTP 요청 timeout
  max_retries: 3        # 네트워크 실패 재시도 횟수
  backoff_base: 2       # 지수 백오프 base (2 ** attempt)

kis_rest:
  circuit_breaker:
    enabled: true
    failure_threshold: 5       # retry 소진 call 연속 N회 실패 시 OPEN
    open_duration_sec: 60      # OPEN 유지 후 half-open 1회 허용

# PIT-Safety snapshot policy (불변 원칙 1 enforcement)
