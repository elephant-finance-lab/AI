    - feat_5m_ret
    - feat_30m_vol
    - feat_60m_trend
  # Dual-Source 5피처 (S4-2). dual_source.enabled_for_lgbm=true 일 때만 feature_cols에 병합.
  # 값 범위: news_score_t (-1~+1), comm_score_t_1 (-1~+1), comm_score_t_2 (-1~+1),
  #          news_comm_divergence (0~2), community_noise_multiplier (0~1).
  # 결측 시 기본값 0.0 (PIT-safe: 점수 없으면 중립 처리).
  dual_source_feature_cols:
    - news_score_t
    - comm_score_t_1
    - comm_score_t_2
    - news_comm_divergence
    - community_noise_multiplier
  # C3 feature_manifest 외생/수급 피처. exogenous_features.enabled_for_lgbm=true 일 때 병합.
