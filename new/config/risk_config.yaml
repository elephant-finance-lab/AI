# ============================================================
# coder2_sprint3_additions: Sprint 3 fix W1/W3/C3 신규 키 (coder2 담당)
# eval_agent.alignment_c1/c2_weight, eval_agent.synthetic_seed,
# alpha_factor.factor_agent_seed는 각 원 섹션(eval_agent/alpha_factor) 끝에
# append 방식으로 추가. 아래 블록은 추가 출처 메모.
# ============================================================
# NOTE: 아래 키들은 각 원 섹션에 직접 추가됨 (아래 별도 섹션 없음).
# eval_agent 섹션 끝: alignment_c1_weight, alignment_c2_weight, synthetic_seed
# alpha_factor 섹션 끝: factor_agent_seed

# ============================================================
# connector_mock: KIS Mock 모드 생성 파라미터 (불변 원칙 5 하드코딩 금지)
# kis_rest.py / kis_ws.py mock 데이터 생성 시 이 섹션에서 로드.
# magic number randint 범위를 yaml SSOT로 관리.
# ============================================================
connector_mock:
  kis:
    base_price: 50000         # mock 가격 기준값 (S0 cleanup, 이전 _MOCK_BASE_PRICE 모듈 상수)
    price_modulo: 100000      # ticker hash offset modulo (S0 cleanup, 이전 _MOCK_PRICE_MODULO)
    volume_min: 1000          # 분봉 거래량 하한 (주)
    volume_max: 100000        # 분봉 거래량 상한 (주)
    change_min: 0             # 가격 보정치 하한 (원)
    change_max: 100           # 가격 보정치 상한 (원)
    bid_size_min: 500         # WS 분봉 거래량 하한 (주)
    bid_size_max: 10000       # WS 분봉 거래량 상한 (주)
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-05-02"
    updated_by: "coder1_sprint012_fix (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 30
    update_trigger: "manual_only"
    rationale: |
      KIS Mock 모드 랜덤 생성 파라미터. 단위 테스트 재현성 + 불변 원칙 5 준수.
      volume_min/max 변경 시 mock 데이터 특성 변경 — operator 검토 권고.
