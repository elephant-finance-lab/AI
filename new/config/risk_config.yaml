    last_updated: "2026-04-20"
    updated_by: "s1_batch_bc"
    mode_b_editable: false           # 하이퍼파라미터 자동 변경 금지. S3-6 재학습은 기존 값 재사용.
    human_approval_required: true    # 하이퍼파라미터 변경은 operator 수동 승인 필수
    backup_retention_days: 180
    update_trigger: "manual_only"
    rationale: "LGBM 하이퍼파라미터 변경은 모델 동작 근본을 바꿈. Mode B 자동 tuning 미허용."
  objective: "lambdarank"
  metric: "ndcg"
  ndcg_eval_at: [5]                 # Top-5 (K=5)
  label_gain: [0, 1, 3, 7]          # relevance grade 0~3 가중치
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 500
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  random_state: 42
  n_relevance_grades: 4             # fwd_return을 4-quantile로 분할
  feature_fraction_seed: 42

# Walk-Forward Split 파라미터 (S1-0 Batch B splitter.py 참조)
# 논문 근거: Prado "Advances in Financial Machine Learning" Ch. 7 + 8
# 1거래일 = 390분. 1년 ≈ 252 거래일.
walk_forward:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-20"
    updated_by: "s1_batch_bc"
    mode_b_editable: false           # 검증 구조 변경 금지. Sprint 4 pilot 후 operator 승인 경유.
    human_approval_required: true
    backup_retention_days: 180
    update_trigger: "manual_only"
    rationale: "walk-forward 파라미터는 성과 평가 정합성 직결. 자동 수정 시 과거 성과 비교 불가."
  n_splits: 8                       # fold 개수 (rolling window)
  train_window_days: 60             # 60 거래일 (23,400 bars/종목)
  test_window_days: 20              # 20 거래일 (7,800 bars/종목)
  step_days: 20                     # fold 간 step = test window와 일치 (no-overlap)
  trading_minutes_per_day: 390      # KRX 정규장 09:00~15:30

# Live data readiness gate. live_data_readiness.py가 이 섹션에서 로드한다.
# 목적: 오래된/부분 파일이 LightGBM 학습 가능 날짜로 계산되는 것을 차단.
live_data_readiness:
  min_rows_per_day: 300             # KIS virtual 과거 분봉은 일부 종목 381 rows도 정상으로 허용
  train_min_rows_per_day: 300       # LightGBM real artifact 날짜 인정 최소 row 수
  min_session_span_minutes: 300      # 오전장 일부만 있는 300-row artifact를 학습 가능 날짜에서 제외
  max_bar_gap_minutes: 5             # 중간 구간 누락/큰 timestamp jump artifact 차단
  allow_closing_auction_gap: true     # KIS 1분봉은 15:19 이후 단일 15:30 종가 bar가 정상
  max_closing_auction_gap_minutes: 15
  known_market_halt_intervals:
    - date: "20260304"                # KRX KOSPI/KOSDAQ circuit breaker; 11:17~11:48 거래정지/단일가 구간
      start: "11:17"
      end: "11:48"
      reason: "KRX KOSPI/KOSDAQ circuit breaker"
    - date: "20260309"                # KRX circuit breaker; 10:32~11:01 거래정지/단일가 구간
      start: "10:32"
      end: "11:01"
      reason: "KRX circuit breaker"
  require_all_tickers_for_backfill: true
  require_all_tickers_for_train: true
  max_consecutive_backfill_failed_dates: 3
  backfill_failed_ticker_ratio_threshold: 0.8
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-05-11"
    updated_by: "codex_live_data_gate"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "manual_only"
    rationale: "실데이터 backfill readiness와 LightGBM train gate. partial/stale artifact가 학습으로 넘어가는 것을 차단한다."

# Label 생성 파라미터 (S1-0 Batch B dataset_builder.py 참조)
# label = fwd_return_{horizon_bars}m. PIT-Safety 준수.
label:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.2.0"
    last_updated: "2026-05-18"
    updated_by: "codex_cost_aware_195m_gate"
    mode_b_editable: false           # label 정의 변경은 모델 학습 목표 변경 = 프로젝트 근본
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_only"
    rationale: "DatasetBuilder 기본 label은 5m_ret로 유지한다. 다만 service-policy는 195분 보유/cooldown과 15bps 비용을 요구하므로 deploy 후보 target은 deploy_target_cols allowlist로 명시 통제한다."
  generation_version: "session_local_v2"
  session_scope: "ticker_trading_day"
  horizon_bars: 5                   # 기본 학습/보조 label 생성 기준
  target_col: "label_5m_ret"
  deploy_target_cols: ["label_5m_ret", "label_195m_net_ret"]
  rank_col: "cs_rank"
  leakage_guard: true               # label 생성 시 미래 참조 검증 필수
  drop_last_n_bars: 5               # 기본 5m label 마지막 5 bars는 label 없음

# Evaluation Metrics 파라미터 (S1-0 Batch B metrics.py 참조)
# C12/C13 metrics 7종 (ic/icir/rank_ic/arr/ir/mdd/sr) 전부 계산.
evaluation:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-20"
    updated_by: "s1_batch_bc"
    mode_b_editable: false           # 평가 지표 정의 변경은 과거 성과 비교 불가 → 금지
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_only"
    rationale: "annualization_factor/regime_labels 변경은 전체 backtest 재계산 필요. operator 승인 필수."
  annualization_factor: 252         # 한국 거래일 기준 연율화
  ic_significance_threshold: 0.02   # |IC| < 0.02 → 유의하지 않음
  regime_labels: [bull, bear, sideways, volatile]   # C13 performance_analyzer와 일치
  min_daily_pnl_std: 1.0e-8         # IR 분모 0 방지 (이 값 미만이면 np.inf clip)
  mdd_sign: "negative"              # MDD 부호 규약 (음수 반환, C12 metrics 필드 일치)
  # S1-0 Batch C 추가 (2026-04-20 Part A 수정): approx daily_pnl 산출 시 Top-K 비율
  # LGBMTrainer._group_for_metrics에서 k = max(1, int(n * top_k_fraction)) 으로 사용.
  # Portfolio Manager 완성 전 임시 지표. S1-3 PM 완성 시 실제 order_deltas 기반 PnL로 대체 예정.
  top_k_fraction: 0.25              # Top quartile long strategy simulation
  # to_performance_vector() 정규화 rolling window (architecture.md §8.1 SSOT)
  # Rank(IC) / Rank(ICIR) 계산 시 사용. normalize_performance_vector() 참조.
  performance_vector_rolling_window: 30   # 30일 rolling window (거래일 기준)
  # 아래 3키 2026-04-21 이관 (architect + modeler MULTI-AGENT CONFIRMED)
  performance_vector_clip_low: 0.01        # 8차원 벡터 min-max 정규화 하한 (api_contracts.md C18)
  performance_vector_clip_high: 0.99       # 상한
  performance_vector_neutral_fallback: 0.5 # history 부재/rng=0 시 neutral 값

# Service-policy replay: KIS paper cash-account execution policy for C14 evidence.
# 실제 paper-auto 제약(저회전/최소 보유/cooldown/no-trade)을 C12 이후 read-only
# replay에 반영한다. 변경 시 C12/service-policy 전체 재실행 필요.
service_policy_replay:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-05-19"
    updated_by: "codex_service_policy_optimization"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_review_then_mode_b_replay"
    rationale: "KIS paper cash-account replay의 거래 빈도/회전율 제약. 변경 시 성과 비교 불가하므로 C12/service-policy 전체 재실행 필요."
  # 2026-05-19 deterministic sweep (BUNDLE-20260518-195M0001, 20250917~20251021):
  # top_k=0.25 kept order caps/cooldown intact while improving service-policy replay
  # from +23.45bps/SR 5.19 to +47.31bps/SR 7.21. Re-run C12/C14 after changes.
  top_k_fraction: 0.25
  decision_stride_bars: 15
  min_holding_bars: 195
  rebalance_cooldown_bars: 195
  no_trade_score_spread: 0.027
  allow_position_pyramiding: false
  turnover_budget_hard_stop: true
  min_expected_net_alpha_bps: 15.0
  expected_net_alpha_source: "rank_score"  # LambdaRank score를 bps로 환산하지 않는다. calibrated_net_bps head 생성 전까지 threshold gate 비활성.
  min_service_policy_sharpe: 0.0

# Cost-aware retraining preparation. 이 섹션은 모델을 자동 deploy하지 않는다.
# 목적은 5m label/cost/turnover mismatch를 다음 Mode B 재학습 실험으로 넘길 때
# 필요한 objective 후보와 gate 입력을 한 곳에 고정하는 것이다.
cost_aware_retraining:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-05-13"
    updated_by: "codex_cost_aware_retraining_prep"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_review_then_mode_b_training"
    rationale: "label horizon / net-of-cost target / turnover objective는 성과 비교 기준을 바꾸므로 operator 승인 및 C12 재실행 필요."
  horizon_candidates: [5, 30, 60, "session_close"]
  objective:
    net_of_cost_target: true
    trade_no_trade_classifier: true
    turnover_penalty_from_ppo_config: true
    min_expected_net_alpha_bps_from_service_policy: true
    require_phase2_non_neutral_coverage: true
    require_service_policy_replay_before_deploy: true
  trade_probability_gate:
    enabled: false
    min_probability: 0.50
    apply_to_policy: "heuristic_only"
  label_horizon_gate:
    min_mean_net_bps: 2.5
    min_positive_net_rate: 0.53
    allow_warn_for_research_only: false

# S4-4 추가 (2026-05-02) — Hot Path 성능 최적화
# HotPathProfiler 단계별 SLA 임계값. 전체 p95 SSOT = quant_agent.latency_p95_target_ms.
# 이 섹션은 단계별 세분화 목적. system_os_metrics L821-L823 중복 선언 금지 준수.
hot_path:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-05-02"
    last_updated: "2026-05-02T00:00:00+09:00"
    updated_by: "s4_4_modeler (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 180
    update_trigger: "manual_only"
    rationale: |
      Hot Path SLA 임계값. 변경 시 단계별 레이턴시 허용 범위 변경.
      operator 수동 승인 필수. Mode B 자동 변경 금지.
  sla:
    p50_ms: 50       # hot_loop 전체 p50 목표 (ms)
    p95_ms: 100      # hot_loop 전체 p95 목표 (ms). SSOT = quant_agent.latency_p95_target_ms
    p99_ms: 150      # hot_loop 전체 p99 목표 (ms)
    alert_on_violation: true   # SLA 위반 시 ops_alerts.jsonl 기록
  # Feature Store 백엔드 결정 (S4-4).
  # A: in-memory (BarBuffer 확장, 재시작 시 warmup 60분)
  # B: parquet (artifacts/feature_store/, 영속 + 몇 ms I/O 추가)
  # C: sqlite (영속 + index, 매 tick I/O)
  # 결정: A (in-memory). Hot Path SLA <100ms 가장 안전. 재시작 warmup 60분으로 커버.
  feature_store:
    backend: "in_memory"       # in_memory | parquet | sqlite
    warmup_bars: 60            # 재시작 후 BarBuffer warmup 필요 bar 수 (= quant_agent.warmup_bars)
    backend_rationale: |
      in_memory 선택 이유:
        - Hot Path <100ms SLA 최우선. in_memory가 가장 낮은 레이턴시.
        - parquet I/O: 3~10ms 추가. SLA 여유 소진.
        - sqlite: 매 tick disk write. 더 높음.
        - 재시작 시 warmup 60분(= warmup_bars)으로 in_memory 상태 복구 가능.
        - 실데이터 연결 전까지 변경 불요.

# S1-1 추가 (2026-04-20) — Quant Agent 런타임 파라미터
# new/src/agents/hot/quant.py 참조. Hot Path <100ms.
# 동기 LLM 미호출. ModelRegistry.load_latest()로 booster 로드 후 추론.
quant_agent:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-20"
    updated_by: "s1_1"
    mode_b_editable: false           # Hot Path 에이전트 파라미터. 수동 승인만.
    human_approval_required: true
    backup_retention_days: 180
    update_trigger: "manual_only"
    rationale: "Quant Agent threshold / warmup 변경은 Hot Path 레이턴시와 시그널 정확성 직결. Mode B 자동 조정 금지."
  warmup_bars: 60                    # cross-sectional score 생성 전 필요한 최소 bar 수
  anomaly_zscore_threshold: 3.0      # intraday drop anomaly 임계 (|z| > threshold → anomaly)
  latency_window: 1000               # p50/p95/p99 측정 창 (최근 N개 기록)
  latency_p95_target_ms: 100         # Hot Path SLA (경고/로그용, enforcement는 S1-9 Monitor)
  investor_flow_stale_sec: 1800      # 수급 side-channel snapshot stale 기준

# Model Registry 파라미터 (S1-0 Batch B registry.py 참조)
# artifacts/lgbm/ 하위 파일 관리. S3-6 야간 재학습이 동일 registry 재사용.
model_registry:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-20"
    updated_by: "s1_batch_bc"
    # C17 명시와 일치: Mode B 야간 재학습이 save() 호출 허용, rollback은 C14 경유
    mode_b_editable: true            # save()는 Mode B 재학습이 자동 호출
    human_approval_required: false   # save 자체는 approval 불요 (C14 deploy gate가 별도 제어)
    backup_retention_days: 90
    update_trigger: "mode_b_nightly"
    rationale: "C17 ModelRegistry save()는 S3-6 야간 재학습 표준 경로. rollback만 C14 ModeBDeployer 경유 필수."
  schema_version: "1.0.0"           # C17 ModelRegistryContract registry_schema.schema_version
  data_version: "1.0.0"
  artifacts_dir: "artifacts/lgbm"
  registry_file: "registry.json"
  latest_symlink: "latest_model.pkl"
  versioning_scheme: "v{n}"         # v1 / v2 / v3 ... (baseline.pkl 별도)
  max_versions_keep: 20             # 오래된 버전 자동 제거 기준
  metadata_required_fields:         # save() 시 필수 메타데이터 키
    - version
    - train_start
    - train_end
    - feature_cols
    - metrics
    - commit_hash
    - data_version
    - created_at
    - label_horizon_bars
    - target_col
    - label_generation_version
    - label_session_scope

# ============================================================
# agent_performance: Layer 2 (Agent 기여도 지표) 임계값
# api_contracts.md C18 AgentPerformanceContract SSOT 대응.
# 2026-04-21 신설 (evaluation_metrics.md 3-Layer 문서와 동시 작성).
# ============================================================
agent_performance:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-21"
    last_updated: "2026-04-21T09:00:00+09:00"
    updated_by: "architect + coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 30
    update_trigger: "C18 AgentPerformanceContract 신설"
    rationale: |
      L2 Agent 기여도 지표 임계값. Sprint 2 AuditLogger 구축 후 실 데이터로 재조정하되
      Mode B 자동 수정 금지. 에이전트 성과 평가에 직결되므로 operator 수동 승인만 허용.

  # L2 7종 임계값. Sprint 2 AuditLogger 구축 후 실 데이터로 재조정.

  # prediction_accuracy (Quant)
  prediction_accuracy_min: 0.52                  # random baseline 0.50 대비 +2%p

  # slippage_execution_shortfall (ExecutionGateway), 단위: bps
  slippage_bps_max: 15                           # execution_cost_model.slippage_bps (10) + 5 margin

  # anomaly_detection_precision_recall (Quant)
  anomaly_precision_min: 0.60
  anomaly_recall_min: 0.40
  anomaly_threshold_pct: -0.01                   # label_t5_ret < -1% 이면 anomaly ground truth

  # sector_exposure_tracking_error (PortfolioManager)
  sector_tracking_error_max: 0.05                # 5% 이내

  # veto_precision_recall (FDA)
  veto_precision_min: 0.60
  veto_recall_min: 0.40
  veto_loss_threshold_pct: -0.005                # label_t5_ret < -0.5% 이면 veto 정답

  # false_positive_event_trigger_rate (News, Risk)
  false_positive_rate_max: 0.40                  # LLM 호출 대비 NORMAL_APPROVE 종결 비율 상한

  # realized_pnl_contribution: ablation leave-one-out. 임계는 에이전트별 양수 (유연).
  realized_pnl_min_positive_count: 5             # 최근 30일 중 양수 일수 최소 5일

  # C18 AgentPerformanceContract SLA (api_contracts.md:1392~1394 SSOT 이관)
  audit_log_append_latency_ms: 5                 # hot path 내 audit 기록 허용 latency
  daily_rollup_duration_min: 10                  # 18:00 이후 집계 완료 소요 시간 (분)

# ============================================================
# system_os_metrics: Layer 3 (System OS 차별점) 임계값
# api_contracts.md C9 (reason_code) + C17 (ModelRegistry) 연동.
# Sprint 4 구축 예정 지표의 선행 threshold 정의.
# ============================================================
system_os_metrics:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-21"
    last_updated: "2026-04-21T09:00:00+09:00"
    updated_by: "architect + coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 30
    update_trigger: "evaluation_metrics.md L3 정의"
    rationale: |
      L3 System OS 차별점 임계값. Sprint 4 Dashboard 구축 전 선행 정의.
      Cause Attribution / Self-Evolution Gain / Dual-Source Lead Time 은 발표 킬러 지표이므로
      Mode B 자동 변경 금지, operator 수동 승인 필수.

  # hot_path_latency_p95_ms: 중복 신설 금지.
  # SSOT = quant_agent.latency_p95_target_ms (현재 100ms). 여기서는 재선언하지 않음.
  # 참조: quant_agent.latency_p95_target_ms

  # cause_attribution_accuracy (L3, Eval Agent Sprint 3~4)
  cause_attribution_accuracy_min: 0.60           # FDA reason_code 사후 검증 정답률 하한

  # cold_path_budget_efficiency (L3)
  # kanana-o 100회/일 예산 대비 marginal PnL. SSOT = llm_budget.kanana_daily_limit (100).
  cold_path_marginal_pnl_min_pct_per_call: 0.0001   # LLM 1회당 최소 +0.01% 기여 기대

  # self_evolution_gain_sharpe (L3, Mode B 배포)
  # C17 ModelRegistry 버전 비교 (v(n+1).sr - v(n).sr).
  self_evolution_gain_threshold: 0.05            # Sharpe lift 최소 +0.05 (Mode B 배포 조건)

  # dual_source_divergence_lead_time_min (L3, Sprint 4 S4-1)
  # divergence 탐지 시각 ~ price break 시각. 목표: divergence 가 price 보다 먼저 발생.
  dual_source_lead_time_target_min: 0            # 양수 = divergence 가 선행. Sprint 4 측정 후 재조정.

  # reason_code_distribution (L3)
  reason_code_top3_coverage_min: 0.80            # 상위 3 reason_code 가 전체의 80% 이상 커버

  # regime_agent_contribution_matrix (L3, regime × agent 2D)
  # risk_config.yaml evaluation.regime_labels 참조.
  regime_breakdown_min_days_per_regime: 10       # 각 regime 최소 10 거래일 샘플

  # Layer 1/2 와의 cross-reference
  cross_reference:
    l1_performance_vector: "MetricsBundle.to_performance_vector() (8-dim)"
    l2_audit_log: "artifacts/audit_log.jsonl"
    c17_registry: "artifacts/lgbm/registry.json"
    c9_reason_code: "api_contracts.md C9 FDADecisionContract"

# ============================================================
# fda_uncertainty_link: Dual-Source divergence → FDA 연계 파라미터
# 2026-04-21 신설 (memory project_v3_universe_and_dual_source.md §2 UQ↔FDA 연계)
# api_contracts.md C9 FDADecisionContract input.uncertainty_score 와 연동.
# Sprint 2 S2-9 FDA Cold Path 구현 시 이 섹션에서 로드 필수. 하드코딩 금지.
# PIT-Safety: divergence는 장전 배치 점수 기반 → 실시간 publish 안전.
# ============================================================
fda_uncertainty_link:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-21"
    last_updated: "2026-04-21T10:00:00+09:00"
    updated_by: "architect + coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 30
    update_trigger: "Sprint 2 전 필수 아이디어 반영 (memory §2 UQ↔FDA 연계)"
    rationale: |
      C9 FDADecision input uncertainty_score 처리 파라미터 (threshold / veto_prior_boost).
      불변 원칙 2 (FDA approve/veto) 직결. veto 확률 변경은 시스템 행동 크게 변경.
      Mode B 자동 변경 금지, operator 수동 승인만 허용.

  uncertainty_threshold: 0.5             # 이 값 이상이면 veto_prior boost (dual_source.divergence_threshold 와 일치)
  veto_prior_boost: 0.15                 # 기본 veto prior 에 +15%p 가산
  reason_code_on_boost: "NEWS_COMMUNITY_DIVERGENCE"  # C9 reason_code_catalog 후보 (community risk sidecar)
  source_channel: "uncertainty_signal"   # C4 SharedMessagePool channel (message_taxonomy.publish_channels 등록)

# ============================================================
# risk_fast: RiskFastAgent sidecar 임계값
# S2-8 RiskFastAgent 실구현 대응. 하드코딩 금지 원칙 (불변 원칙 5).
# 모든 수치는 이 섹션에서만 정의. 코드에서 직접 수치 사용 금지.
# ============================================================
# S2-9 실구현 대응: DebateAgent 설정
# cold/debate.py가 이 섹션 참조. 불변 원칙 5: 하드코딩 금지.
debate:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-26"
    last_updated: "2026-04-26T00:00:00+09:00"
    updated_by: "s2_9_coder (elephant-ops)"
    mode_b_editable: true       # trigger 임계값은 Mode B 야간 갱신 대상
    human_approval_required: false
    backup_retention_days: 30
    update_trigger: "mode_b_nightly"
    rationale: "DebateAgent 설정. max_pairwise/uncertainty_threshold는 Mode B 야간 False Positive 분석 후 자동 갱신 가능."
  max_pairwise: 45          # C6 SSOT: C(10,2)=45 쌍 (10 에이전트 기준)
  uncertainty_threshold: 0.7  # uncertainty_delta > 임계값 → DEBATE_CONFLICT veto
  llm_caller: "debate_agent"      # LLMRouter caller 식별자
  max_runtime_sec: 15       # bounded_execution.debate_agent_max_sec와 동일한 cold-path deadline
  conflict_criteria:        # C6 SSOT (debate.py _CONFLICT_PATTERNS 하드코딩 제거 → yaml 이동)
    - signal_a: "quant_top10"
      signal_b: "veto_recommendation"
      reason: "Quant TOP-10 종목에 대한 Risk veto 충돌"
    - signal_a: "quant_buy"
      signal_b: "risk_high"
      reason: "Quant 매수 신호 + Risk high 동시 발생"
    - signal_a: "news_sell"
      signal_b: "quant_top5"
      reason: "News 매도 알림 + Quant TOP-5 동시 발생"

risk_fast:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-25"
    last_updated: "2026-04-25T00:00:00+09:00"
    updated_by: "s2_8_coder (elephant-ops)"
    mode_b_editable: false          # 리스크 임계값은 Mode B 자동 변경 금지
    human_approval_required: true   # 임계값 변경은 operator 수동 승인 필수
    backup_retention_days: 180
    update_trigger: "manual_only"
    rationale: |
      RiskFastAgent 비LLM 규칙 기반 임계값. Hot Path sidecar (<50ms).
      임계값 변경 시 FP/FN 균형 직결. operator 수동 승인만 허용.
  sla_ms: 50                        # Cold Path RiskAgentFast SLA (50ms 이내 완료 목표)
  intraday_drop_pct: 0.05           # 5% 급락 임계값 (high 트리거)
  volume_spike_multiplier: 3.0      # 거래량 평균 대비 N배 초과 (medium 트리거)
  volatility_bp_threshold: 30       # 1분 return std > 30bp (medium 트리거)
  top10_collapse_count: 3           # Top10 중 high 트리거 N개 이상 → critical
  volume_lookback_bars: 20          # 거래량 평균 계산 기준 봉 수
  min_bars_required: 2              # 규칙 평가 최소 bar 수
  narrative_max_chars: 300          # RiskSlow LLM 응답 narrative 최대 길이

  # Cold Path RiskAgentFast (cold/risk_fast.py) 전용 임계값
  # Hot Path sidecar(위 섹션)와 별개. Cold Path 이벤트 기반 규칙.
  cold_path:
    comm_volume_zscore: 2.5         # 커뮤니티 게시글 z-score 초과 → comm_volume_spike
    comm_sentiment_delta: 0.5       # 감성 점수 30분 변화율 절대값 초과 → comm_sentiment_delta
    intraday_return_zscore: -3.0    # 분봉 수익률 z-score 이하 → intraday_drop_anomaly
    foreign_net_sell_krw: -100000000000.0  # 외국인 순매도 음수 컨벤션 (-100B KRW 이하) → foreign_net_sell_critical
    news_comm_divergence: 0.5       # 뉴스-커뮤니티 방향 불일치 절대값 초과 → news_comm_divergence_strong

# ============================================================
# message_pool: C4 SharedMessagePool 운영 파라미터
# api_contracts.md C4 SSOT. 2026-04-21 S2-1 신설.
# ============================================================
message_pool:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-21"
    last_updated: "2026-04-21T12:00:00+09:00"
    updated_by: "s2_1_coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 30
    update_trigger: "S2-1 MessagePool 실구현"
    rationale: "MessagePool TTL/pool_size 는 메모리 관리 직결. 자동 변경 금지."
  default_ttl_sec: 300            # publish 시 ttl 미지정 시 5분 (300초)
  max_pool_size: 10000            # 메모리 보호 상한. 초과 시 expire 후 재시도 → RuntimeError

# ============================================================
# Mode B Scheduler (C14 ModeBSchedulerContract)
# S3-0 신설 (2026-04-27). 7단계 오케스트레이션 SLA + 감사 로그 경로.
# ============================================================
mode_b_scheduler:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-27"
    updated_by: "s3_0_coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "manual"
    rationale: |
      Mode B Scheduler stage timeout 은 C14 SLA 직결.
      자동 수정 시 stage 완료 판정 기준이 바뀌어 배포 게이트 오동작 가능.
      stage_timeouts 변경은 operator 수동 확인 후 commit.
  stage_timeouts:
    stage_0: 120         # 18:00 DQR (S4-5, 2분 SLA)
    stage_1: 30          # 18:00 성과 분석
    stage_2: 60          # 18:30 방향 결정
    stage_3: 3600        # 19:00 Alpha Factor Engine
    stage_4: 1800        # 20:00 모델 재학습
    stage_5: 1800        # 20:30 에이전트 자기 개선
    stage_6: 1800        # 21:00 Backtest 검증
    stage_7: 900         # 22:00 배포
  execution_window:
    start_hour: 18
    end_hour: 22
  audit_log_path: "artifacts/mode_b_audit_log.jsonl"
  weekdays: ["MON", "TUE", "WED", "THU", "FRI"]

# ============================================================
# Alpha Factor Engine (S3-1/S3-2/S3-3)
# ============================================================
alpha_factor:
  hypothesis_path: "artifacts/alpha_factor/hypotheses.jsonl"
  factor_zoo_path: "artifacts/alpha_factor/factor_zoo.jsonl"
  max_hypotheses_per_round: 3
  max_ast_complexity: 10          # SL(f) 상한 (AlphaAgent 3중 정규화)
  max_retries: 3                  # S3-2 FactorAgent 구현 실패 시 재시도 횟수
  ic_duplicate_threshold: 0.99   # IC_max >= 0.99 → 중복 제거
  alpha_decay_warning_months: 3  # IC 3개월 연속 하락 → decay 경고
  alpha_decay_retire_months: 6   # IC 6개월 연속 하락 → 자동 은퇴
  # W3 yaml화: factor_agent._make_test_df seed (불변 원칙 5).
  factor_agent_seed: 42         # FactorAgent 검증용 test_df seed (재현성)
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-27"
    updated_by: "s3_1_coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "mode_b_nightly"
    rationale: |
      Alpha Factor Engine 경로/임계값. hypothesis_path/factor_zoo_path는 Mode B
      IdeaAgent/FactorAgent가 append하는 JSONL 경로. max_ast_complexity/ic_duplicate_threshold 등
      정규화 파라미터는 AlphaAgent 3중 정규화(SL+PC+ER) 직결. 자동 변경 금지.

# ============================================================
# eval_agent: S3-3 EvalAgent 3중 정규화 파라미터
# AlphaAgent 논문 기반. R_g(f,h) = α₁·SL(f) + α₂·PC(f) + α₃·ER(f,h)
# R_g < r_g_threshold이면 채택 (낮을수록 좋음).
# 하드코딩 금지: eval_agent.py는 이 섹션에서만 수치 로드.
# ============================================================
eval_agent:
  # 3중 정규화 가중치 (합산 = 1.0)
  alpha_1: 0.3    # SL weight (AST 복잡도 페널티)
  alpha_2: 0.2    # PC weight (파라미터 수 페널티)
  alpha_3: 0.5    # ER weight (경제적 관련성)
  # ER 내부 가중치 (beta 합산 = 1.0)
  beta_1: 0.4     # S(f): 기존 zoo와의 IC 유사도 페널티
  beta_2: 0.4     # C(h,d,f): 가설↔수식 정합 페널티
  beta_3: 0.2     # feature count 정규화 페널티
  # 임계값
  r_g_threshold: 0.7       # R_g < threshold이면 채택
  ic_min_threshold: 0.02   # |IC| 하한 (경제적 의미 있음)
  alignment_threshold: 0.7 # C(h,d,f) 상한 (가설↔수식 정합)
  max_pc: 5                # 최대 파라미터 수 (윈도우 개수 기준)
  log_scale: 3.0           # ER beta_3 정규화 스케일 (log(1+n)/log_scale)
  sl_clip_max: 2.0         # SL 클립 상한 (1.0 초과 = complexity_violation 허용)
  synthetic_bars: 50       # IC 계산용 synthetic DataFrame bar 수
  min_valid_samples: 5     # IC 계산 최소 유효 샘플 수
  # C3 yaml화: _compute_alignment 가중치 (불변 원칙 5).
  alignment_c1_weight: 0.5  # C(h,d,f) c1 가중치 (hypothesis ↔ description)
  alignment_c2_weight: 0.5  # C(h,d,f) c2 가중치 (description ↔ factor code)
  # W3 yaml화: synthetic DataFrame seed (eval_agent._make_synthetic_df).
  synthetic_seed: 42        # IC 계산용 synthetic OHLCV seed (재현성)
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-28"
    updated_by: "s3_3_coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "manual"
    rationale: |
      EvalAgent 3중 정규화 가중치 및 임계값. AlphaAgent 논문 §3 기반.
      alpha/beta 가중치 변경 시 팩터 채택 기준 전면 재조정 필요.
      r_g_threshold/ic_min_threshold는 factor zoo 품질 직결. 자동 변경 금지.

# ============================================================
# co_steer: S3-5 Co-STEER Orchestrator (RD-Agent 논문 §8.2 Thompson Sampling)
# ThompsonSampler Beta(α, β) Multi-Armed Bandit 상태 지속 경로.
# 하드코딩 금지: co_steer.py는 이 섹션에서만 수치 로드.
# ============================================================
co_steer:
  actions: ["factor_evolution", "model_evolution"]
  alpha_init: 1.0
  beta_init: 1.0
  state_path: "artifacts/co_steer/thompson_state.json"
  history_path: "artifacts/co_steer/co_steer_history.jsonl"
  complexity_delta: 0.1
  min_ic_reward: 0.02
  model_evolution_stub_reward: 0.5  # S3-6 실구현 전 model_evolution stub reward
  # S3 알고리즘 수정 (2026-05-01): ThompsonSampler global RNG → 격리 Generator.
  # null(기본): 비결정적 (운영 환경). 정수 지정 시 결정적 (테스트/재현성용).
  thompson_seed: null
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-29"
    updated_by: "Sprint 3 SHIP (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "mode_b_nightly"

# ============================================================
# nightly_retrainer: S3-6 NightlyLGBMRetrainer 파라미터
# nightly_lgbm_retrainer.py가 이 섹션에서 로드 (불변 원칙 5 하드코딩 금지).
# ============================================================
nightly_retrainer:
  lookback_days: 365       # 재학습 데이터 기간 (일). walk_forward 8 folds 확보용.
  max_alpha_factors: 5     # 사용할 최대 alpha factor 수 (FactorZoo active 상위 N개)
  tickers: []              # 빈 리스트 = DatasetBuilder 기본값 (20 KOSPI 종목)
  synthetic_fallback_enabled: true  # KIS/backfill 데이터 부재 시 mock 1분봉 학습 허용
  synthetic_seed: 42       # synthetic fallback 재현성 seed
  synthetic_session_start: "09:00"   # KRX regular session start for synthetic fallback bars
  synthetic_drift_scale: 0.00005     # ticker별 deterministic drift scale
  synthetic_return_noise_std: 0.0015 # synthetic 1m return noise std
  synthetic_min_price: 1000.0        # synthetic OHLC lower price guard
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.1.0"
    last_updated: "2026-05-09"
    updated_by: "codex_bt_diag_fix (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "mode_b_nightly"
    rationale: |
      NightlyLGBMRetrainer sliding window 파라미터.
      lookback_days 변경은 학습 데이터량 직결 (단축 시 과적합 위험).
      max_alpha_factors 변경은 feature 수 변화 → 모델 구조 영향.
      tickers 빈 리스트 = DatasetBuilder 내부 KOSPI 20 기본값 사용.
      synthetic_fallback_enabled=true 는 KIS 키 blocker 환경의 발표/CI 검증용.
      candidate metadata에 synthetic_fallback=true를 남겨 실거래 검증과 분리한다.
      자동 변경 금지 (operator 수동 검토 필요).

# ============================================================
# nightly_ppo_retrainer: S3-7 NightlyPPORetrainer 파라미터
# AllocationEnv + stable-baselines3 PPO 야간 재학습.
# 하드코딩 금지: nightly_ppo_retrainer.py는 이 섹션에서만 수치 로드.
# ============================================================
nightly_ppo_retrainer:
  n_stocks: 20                   # 대상 종목 수 (KOSPI active universe)
  lookback_days: 30              # synthetic data 생성 기간 (일)
  total_timesteps: 10000         # PPO 학습 스텝 수 (빠른 수렴용. Sprint 4에서 증가)
  episode_length: 390            # 에피소드 길이 (1거래일 = 390 분봉)
  turnover_penalty: 0.001        # 거래비용 페널티 (per unit turnover)
  constraint_penalty: 0.5        # max_single_name 위반 페널티 계수
  n_envs: 1                      # 병렬 환경 수 (nightly 단독 실행)
  artifacts_path: "artifacts/ppo"
  ppo_n_steps: 2048              # PPO n_steps (학습 배치 수집 스텝 수)
  ppo_batch_size: 64             # PPO mini-batch 크기
  ppo_n_epochs: 10               # PPO 업데이트 epoch 수
  ppo_seed: 42                   # PPO 학습 재현성 seed
  synthetic_seed: 42             # synthetic data 생성 seed
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-30"
    updated_by: "s3_7_coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "mode_b_nightly"
    rationale: |
      NightlyPPORetrainer 학습 파라미터. stable-baselines3 PPO + AllocationEnv.
      total_timesteps: 빠른 야간 수렴 목표 (Sprint 4에서 100000+로 증가 예정).
      episode_length: 1거래일 1분봉 수. 거래소 정책 변경 시만 수동 조정.
      turnover_penalty/constraint_penalty: reward shaping 핵심. 자동 변경 금지.

# ============================================================
# committee: S3-8 Committee (AlphaGAT Stage II) 앙상블 파라미터
# tree_core(LightGBM) + CNN confirmatory + MetaFuser(LogisticRegression OOF)
# 하드코딩 금지: committee.py는 이 섹션에서만 수치 로드.
# ============================================================
committee:
  # CNN confirmatory branch
  cnn_lookback: 1                # feature dimension을 시계열로 처리하는 window (현재 1 = point-wise)
  cnn_hidden_channels: 32        # Conv1d hidden channels
  cnn_learning_rate: 0.001       # CNN 학습률
  cnn_epochs: 10                 # CNN 학습 epoch 수 (빠른 nightly 수렴용)
  cnn_batch_size: 64             # CNN mini-batch 크기
  cnn_seed: 42                   # CNN 학습 재현성 seed
  # MetaFuser
  meta_fuser_max_iter: 100       # LogisticRegression max_iter
  meta_fuser_C: 1.0              # LogisticRegression regularization C
  # Sharpe 비교 검증
  sharpe_improvement_threshold: 0.0  # committee_sr - tree_sr > threshold이면 improved
  artifacts_path: "artifacts/committee"
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-30"
    updated_by: "s3_8_coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "mode_b_nightly"
    rationale: |
      Committee 앙상블 파라미터. AlphaGAT Stage II 기반.
      cnn_epochs/cnn_hidden_channels 변경은 학습 품질에 직결. 자동 변경 금지.
      sharpe_improvement_threshold: committee가 tree_only보다 나은지 판단 기준.
      메타파라미터 변경 전 ablation 검증 필수.

# ============================================================
# knowledge_base: S3-11 KnowledgeBase Layer 5 파라미터
# new/src/knowledge/kb.py가 이 섹션에서 로드 (불변 원칙 5 하드코딩 금지).
# 6 storage_type: micro_notes/macro_notes/debate_history/decision_history/backtest_history/factor_zoo
# PIT-Safety: timestamp <= now() 강제. data_versions/ 스냅샷으로 PIT replay 지원.
# ============================================================
knowledge_base:
  storage_root: "artifacts/knowledge_base"
  storage_types:
    - micro_notes
    - macro_notes
    - debate_history
    - decision_history
    - backtest_history
    - factor_zoo
  search_default_top_k: 5
  search_recency_boost_lambda: 0.1   # exp(-lambda * days_old)
  required_fields:
    - content
    - sent_from
    - timestamp
  pit_safety_check: true
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-05-01"
    updated_by: "s3_11_modeler (elephant-ops)"
    mode_b_editable: false
    human_approval_required: false
    backup_retention_days: 365
    update_trigger: "mode_b_nightly"
    rationale: |
      KB Layer 5 설정. storage_root/storage_types 변경 시 기존 JSONL 경로 불일치 발생.
      required_fields 변경 시 write validation 기준 바뀜. 자동 변경 금지.
      pit_safety_check: timestamp 미래 참조 차단 (불변 원칙 1 직결).

# ============================================================
# agent_memory: S4-8 Agent Memory 영속화. AgentMemoryRestorer 로드 (불변 원칙 5).
# 5종 storage_type: micro_notes/macro_notes/debate_history/decision_history/backtest_history
# restore_window_days: KB에서 복원할 과거 일수. restore_max_entries_per_agent: 에이전트당 최대 복원 수.
# ttl_days: storage_type별 보관 일수 (미래 TTL pruner 연동 기준).
# enabled: false 시 restore_all() 즉시 반환 (테스트 편의).
# ============================================================
agent_memory:
  enabled: true
  storage_types:
    - micro_notes
    - macro_notes
    - debate_history
    - decision_history
    - backtest_history
  restore_window_days: 7
  restore_max_entries_per_agent: 100
  ttl_days:
    micro_notes: 30
    macro_notes: 90
    debate_history: 30
    decision_history: 365
    backtest_history: 365

# ============================================================
# backtest: BacktestEngine ARR 계산용 초기 자본 (S3 알고리즘 수정 2026-05-01)
# daily_pnl(dollar) → 수익률 비율 변환 기준. 단위 혼용 방지.
# 하드코딩 금지: validation_tools.py는 이 섹션에서 로드.
# ============================================================
backtest:
  # initial_capital: ARR 연율화 시 dollar PnL을 수익률 비율로 변환하는 기준 자본.
  # 1억 KRW = mock 백테스트 기본값. Sprint 4 실계좌 연동 시 실제 운용 자본으로 대체.
  initial_capital: 100000000.0   # 1억 KRW (mock 기본값)

# ============================================================
# alpha_decay_monitor: FactorZoo decay 비가역 방지 opt-in 설정 (S3 알고리즘 수정 2026-05-01)
# factor_zoo.py가 이 섹션에서 로드. 기본값: 비가역 보존 (allow_decayed_revival: false).
# ============================================================
alpha_decay_monitor:
  # allow_decayed_revival: decayed 팩터가 IC 회복 시 active로 복귀 허용 여부.
  # false(기본): 기존 단방향 (active → decayed → retired) 보존.
  # true: IC 회복 시 decayed → active 복귀 가능. retired는 여전히 불가.
  allow_decayed_revival: false
  # revival_threshold: |IC| 최근 warn_months 평균이 이 값 초과 시 복귀.
  # alpha_factor.alpha_decay_warning_months 개월 기준.
  revival_threshold: 0.02

# ============================================================
# cache: S4-7 Persistent Cache (뉴스/에이전트 보고서). Cold Path 레이턴시 최적화.
# persistent_cache.py가 이 섹션에서 로드. 하드코딩 금지.
# ============================================================
cache:
  # enabled: false로 설정 시 모든 get/set noop 처리.
  enabled: true
  # backend: 저장 백엔드. sqlite 고정 (Python stdlib, 동시성 안전).
  backend: sqlite
  # storage_path: DB 파일 경로 (repo root 기준 상대 경로 또는 절대 경로).
  storage_path: artifacts/cache/persistent_cache.db
  # news_ttl_seconds: 뉴스 분석 LLM 결과 캐시 유지 시간 (초). 기본 3600 = 1시간.
  news_ttl_seconds: 3600
  # agent_report_ttl_seconds: 에이전트 보고서 (Risk Slow, Debate) 캐시 유지 시간 (초). 기본 1800 = 30분.
  agent_report_ttl_seconds: 1800
  # cleanup_interval_seconds: 만료 항목 lazy 정리 주기 (초). 기본 600 = 10분.
  cleanup_interval_seconds: 600
  # max_entries: DB 최대 항목 수. 초과 시 가장 오래된 항목 LRU eviction (disk full 방지).
  # ttl=0 (만료 없음) 항목 무한 누적 방지용.
  max_entries: 100000

# ============================================================
# dqr: S4-5 Data Quality Report 일별 자동화 설정.
# DQRRunner가 이 섹션에서 로드. 하드코딩 금지 (불변 원칙 5).
# Mode B 18:00 KST 이후 실행. PIT-Safety 강제 (불변 원칙 1).
# ============================================================
dqr:
  enabled: true
  output_dir: artifacts/dqr
  ops_alert_path: artifacts/ops_alerts.jsonl

  # thresholds: 임계값 초과 시 check_alerts()가 alert 생성.
  # 단위: missing_rate_pct / outlier_rate_pct / error_rate_pct = % / delay_minutes = 분.
  thresholds:
    missing_rate_pct: 5.0        # 누락률 5% 초과 시 alert
    delay_minutes: 10.0          # 수집-적재 지연 10분 초과 시 alert
    outlier_rate_pct: 2.0        # MAD robust-z |z|>5 이상치 2% 초과 시 alert
    error_rate_pct: 1.0          # HTTP 4xx/5xx + retry 에러율 1% 초과 시 alert

  # expected_bars: 커넥터별 하루 기대 데이터 건수.
  # kis_rest/kis_ws: 장중 09:00~15:30 = 390 1분봉.
  # community: 5분 폴링 = 78회 (390/5).
  # dart_rest/naver_rest: 1분 폴링 = 390회.
  # ecos_rest/krx_rest/us_market: 일 1회 배치.
  expected_bars:
    kis_rest: 390
    kis_ws: 390
    krx_rest: 1
    dart_rest: 390
    naver_rest: 390
    community: 78
    ecos_rest: 1
    us_market: 1

  # per_connector: 커넥터별 개별 설정.
  # critical=true: 임계값 초과 시 severity=CRITICAL (이 커넥터 없이 Mode B 진행 차단).
  # critical=false: severity=WARNING (Mode B 계속 진행).
  per_connector:
    kis_rest:
      critical: true
    kis_ws:
      critical: true
    krx_rest:
      critical: false
    dart_rest:
      critical: false
    naver_rest:
      critical: false
    community:
      critical: false
    ecos_rest:
      critical: false
    us_market:
      critical: false

  # alert_channels: alert 기록 채널.
  # log: logger.ERROR 레벨 출력.
  # jsonl: artifacts/ops_alerts.jsonl append.
  alert_channels:
    - log
    - jsonl
  # outlier_z_threshold: MAD robust-z 이상치 임계값. W1 yaml화 (불변 원칙 5).
  # DQRRunner._compute_outlier_rate에 주입.
  outlier_z_threshold: 5.0

  # skip_on_holiday: KRX 비거래일(주말/공휴일)에 DQR skip (missing_rate=100% false CRITICAL 방지).
  skip_on_holiday: true

  # kospi_holidays_YYYY: KRX 평일 휴장일. 토/일은 별도 weekday 체크.
  # 2016~2025 목록은 pykrx KOSPI 대형주 union 일봉 기준으로 역산해 10y research dataset calendar guard에 사용한다.
