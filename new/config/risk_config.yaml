# KOSPI Decision OS v3 — Risk Configuration
# 이 값들은 default이며 final freeze 전.
# Freeze 조건: 1분봉 백테스트 50거래일 + walk-forward 검증 후 재조정.
# 코드에서 이 파일을 로드하라. 하드코딩 금지.
#
# v2.2 변경점 (2026-04-09):
#   - mode_b_metadata 통일 블록 추가 (Mode B 자동 수정 금지)
#   - backtest_agent 섹션 신규 (C12 BacktestAgentContract SLA + deploy gate)
#   - validation_tools 섹션 신규 (C13 ValidationToolsContract SLA)
#   - execution_cost_model 섹션 신규 (BacktestEngine 거래비용 모델)
#
# v3 변경점 (2026-04-20, S1-0 Batch B+C):
#   - validation_tools.backtest_engine.purge_bars 390→60, embargo_bars 390→78 (Prado 1% rule)
#   - lightgbm 섹션 신규 (LightGBM LambdaRank 하이퍼파라미터)
#   - walk_forward 섹션 신규 (fold/window 파라미터)
#   - label 섹션 신규 (horizon_bars=5, target_col=label_5m_ret)
#   - evaluation 섹션 신규 (annualization_factor, top_k_fraction 등 C12/C13 정렬)
#   - model_registry 섹션 신규 (C17 ModelRegistryContract 구현 지원)
#   - preprocessor 섹션 확장 (feature_cols, rolling_min_periods)
#   - 신규 5개 섹션에 mode_b_metadata 블록 추가 (Part B 2026-04-20)

mode_b_metadata:
  schema_version: "1.0.0"
  data_version: "1.0.0"
  last_updated: "2026-04-09"
  updated_by: "initial"
  mode_b_editable: false           # risk_config는 Mode B가 자동 수정 금지 (수동 업데이트만)
  human_approval_required: true    # 리스크 정책 변경은 operator 승인 필수
  backup_retention_days: 365       # 리스크 정책은 장기 보관
  update_trigger: "manual_only"
  rationale: "리스크 정책은 사용자 안전 관련. Mode B가 자동으로 임계값을 조정하면 의도치 않은 리스크 노출 가능. 모든 변경은 operator가 백테스트 50거래일 + walk-forward 검증 후 수동으로 freeze."

regime_gate:
  vix_proxy:
    red_gte: 90                # >= 90%: 위험 (극단적 변동성)
    yellow_gte: 70             # >= 70%: 주의
  market_breadth:
    red_lt: 0.30               # < 30%: 위험
    yellow_lt: 0.45            # < 45%: 주의
  actions:
    green:
      new_entry_weight_multiplier: 1.0    # 정상 — 풀 투자
    yellow:
      new_entry_weight_multiplier: 0.5    # 주의 — 신규 진입 비중 50% 감축
    red:
      new_entry_weight_multiplier: 0.0    # 위험 — 신규 진입 금지

turnover_cap:
  daily_max: 0.30              # 일일 최대 회전율 30%

# Codex 권고 8 (2026-05-09): PM boundary 정책 SSOT.
# false (default backward-compat): PM 이 PPO target_weights 를 max_names/max_single_name 기준 clip/drop/renorm.
# true (strict, 권장): PM 이 PPO weights 그대로 + violation 만 errors.ppo_violations 에 보고. 발표 핵심 차별점
# "PPO 가 비중 결정, PM 이 order_deltas" boundary spirit 보존. 운영 권장 = true.
portfolio_manager:
  respect_ppo_weights: true    # 운영 default. PM은 PPO weights를 변경하지 않고 violation만 보고.
  rationale: "PPO Allocator (C7) 가 비중 결정 권한, PM (C8) 은 order_deltas 변환만. respect=true 시 PM 이 weights 변경 없이 violation 보고."

position_limits:
  max_names: 10                # trade universe 전용 최대 보유 종목 수. Sprint 5 동적 overlay는 dynamic_universe.holdings_max 별도 (=5). 총 최대 = 15.
  max_single_name: 0.20        # 단일 종목 비중 상한 (20%)
  max_sector: 0.40             # 섹터 비중 상한 (40%)
  min_cash: 0.10               # 최소 현금 비율 (10%)
  # min_confidence: softmax(quant_scores)[ticker] 기준. 20종목 평균 0.05.
  # 2026-04-20 Phase 2: 0.30 → 0.03 재조정 (dead zone 방지).
  # 0.30이면 20종목 softmax 평균(0.05)보다 6배 커서 Hot Path 전면 empty allocation 위험.
  min_confidence: 0.03         # 0.03 = 20종목 평균 softmax의 60% 수준 (reasonable filter)

kill_switch:
  daily_loss_threshold: 0.05   # 일일 최대 손실 5% (양수 절대값, 부호 혼동 방지). 트리거: daily_pnl <= -daily_loss_threshold
  action: "emergency_halt"     # 전량 시장가 청산 + 시스템 중단
  # S1-7 추가 (2026-04-20): operator reset token (Sprint 4 전 RBAC 실 인증 교체 필수)
  operator_reset_token: "OPERATOR_RESET"

# S1-7 SafetyGuards + S1-0 Batch A 감사 반영 (2026-04-20 Phase 1 수정)
# safety_guards.py 참조. S-3 Sanity Check + S-4 Reconciliation 임계값.
safety_guards:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-20"
    updated_by: "s1_audit_phase_1"
    mode_b_editable: false           # 안전 가드 임계값은 Mode B 자동 변경 금지
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_only"
    rationale: "Safety guard는 운영 안전 직결. operator 수동 승인만 허용."
  sanity_max_change_pct: 0.10        # ±10% 초과 = 가격 이상치 (S-3)
  reconciliation_tol_qty: 0          # system vs KIS positions qty 허용 오차 (기본: 정확 일치)

# 장중 시간 정의 (KRX 정규장, 2026-04-20 Phase 1 추가)
# backfill.py / event_normalizer.py가 참조. 하드코딩 금지 원칙.
market_hours:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-04-20"
    updated_by: "s1_audit_phase_1"
    mode_b_editable: false           # KRX 정규장 시간은 거래소 정책. 자동 변경 불가.
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_only"
    rationale: "장 시간 변경은 KRX 공식 공지 시에만. Mode B 자동 수정 금지."
  open: "09:00:00"                   # KRX 정규장 개장
  close: "15:30:00"                  # KRX 정규장 마감 (투자자별 수급 발표 기준 시각)
  timezone: "Asia/Seoul"

alpha_decay:
  ic_warning_months: 3         # IC 연속 하락 경고 기간
  ic_retire_months: 6          # IC 연속 하락 시 자동 은퇴

execution:
  mode: "mock"                 # mock | paper | live
  live_enabled: false          # true면 실계좌 주문 가능
  allowed_order_types: ["00"]  # KIS ORD_DVSN whitelist. 기본 지정가만 허용
  price_tick_bands:
    - {min_price: 0, tick_size: 1}
    - {min_price: 1000, tick_size: 5}
    - {min_price: 5000, tick_size: 10}
    - {min_price: 10000, tick_size: 50}
    - {min_price: 50000, tick_size: 100}
    - {min_price: 100000, tick_size: 500}
    - {min_price: 500000, tick_size: 1000}

paper_trading:
  report_dir: "artifacts/reports/paper_trading"
  confirm_order_phrase: "PAPER_ORDER_OK"
  require_virtual_mode: true
  max_probe_order_qty: 1
  allow_market_order: false
  evidence_max_age_sec: 86400

paper_auto_trading:
  report_dir: "artifacts/reports/paper_auto_trading"
  confirm_start_phrase: "PAPER_AUTO_OK"
  enforce_market_session: true
  market_open_time: "09:00"
  market_close_time: "15:30"
  require_virtual_mode: true
  require_prelive_pass: true
  require_active_model: true
  default_max_cycles: 1
  default_interval_sec: 60
  max_tickers: 30
  max_orders_per_cycle: 3
  max_order_qty_per_order: 2
  max_order_qty_per_order_prelive_cap: 2
  allow_market_order: false
  use_latest_ppo_policy_if_available: true

mode_b_deploy:
  report_dir: "artifacts/reports/deploy"
  confirm_deploy_phrase: "DEPLOY_CANDIDATE_OK"

bounded_execution:
  news_agent_max_sec: 10
  risk_agent_max_sec: 10
  debate_agent_max_sec: 15
  fda_max_sec: 30
  max_refinement_rounds: 3

investor_flow:
  foreign_net_sell_warning: -50000000000    # 외국인 순매도 500억원 이상 → warning
  foreign_net_sell_critical: -100000000000  # 외국인 순매도 1000억원 이상 → critical
  institutional_net_sell_warning: -30000000000  # 기관 순매도 300억원 이상
  scope: "ticker"                           # 종목별 감시 (market 전체도 가능)

event_admission:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-21"
    last_updated: "2026-04-21T11:00:00+09:00"
    updated_by: "s2_0_coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 30
    update_trigger: "S2-0 EventAdmission 실구현"
    rationale: |
      C11 EventAdmission 3 필터 임계값 (dedupe TTL / backlog / jobs_per_minute).
      Cold Path 전체 처리량에 직결되며 변경 시 이벤트 drop 패턴 변화. Mode B 자동 수정 금지.
  max_backlog: 3               # 동시 이벤트 최대 처리 수
  stale_drop: true
  max_cold_path_jobs_per_minute: 10   # 1분 내 최대 Cold Path 처리 수
  jobs_per_minute_window_sec: 60      # jobs/min rolling window 크기 (초). 하드코딩 금지 대응.
  comparator_sort_key: ["priority", "trigger_type", "scope", "recency"]
  dedupe_ttl_sec: 300          # dedupe cache TTL (5분)
  dead_letter_path: "artifacts/dead_letter.jsonl"   # C11 dead_letter_log 경로
  dead_letter_retention_days: 30   # C11 dead_letter_log.retention_days

llm_budget:
  kanana_daily_limit: 100        # Kanana-o 일일 호출 한도
  overflow_to: "gpt-4o"          # 한도 초과 시 GPT-4o fallback
  budget_allocation:
    news_agent: 30
    dart_analysis: 3
    risk_agent: 15
    community_anomaly: 5
    fda_cold_path: 12
    debate_agent: 5
    buffer: 30
  # S2-2 신설 (2026-04-21) — LLM Router 메타데이터
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-21"
    last_updated: "2026-04-21T13:00:00+09:00"
    updated_by: "s2_2_coder (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 30
    update_trigger: "S2-2 LLM Router 실구현"
    rationale: "LLM 예산 정책 변경은 장중 LLM 호출 한도 직결. 자동 수정 금지. Kanana-o 100회/일 한도는 API 계약과 직결되므로 operator 수동 승인만 허용."

  # S2-2 신설 (2026-04-21) — circuit breaker 설정
  circuit_breaker:
    failure_threshold: 3       # 연속 실패 N회 → OPEN
    open_duration_sec: 300     # OPEN 유지 시간 (5분). 경과 후 HALF_OPEN
    # HALF_OPEN 1회 성공 시 CLOSED 복귀, 실패 시 즉시 OPEN 재차단

  # S2-2 신설 (2026-04-21) — SLA
  sla:
    timeout_sec: 30.0          # LLM 호출 단일 요청 타임아웃 (초)
    gpt4o_cost_placeholder_usd: 0.001   # Sprint 4 S4-6 실 API 통합 전 placeholder
    kanana_cost_placeholder_usd: 0.0    # Kanana 비용 (현재 0)

  # S2-2 신설 (2026-04-21) — Mode B GPT-4o 호출 허용 에이전트 화이트리스트
  # 불변 원칙 3 강제: 이 목록에 없는 caller가 mode='mode_b' 호출 시 RuntimeError
  mode_b_allowed_callers:
    - backtest_reasoning     # C12 Backtest Agent
    - factor_hypothesis      # S3-1 Idea Agent
    - factor_implementation  # S3-2 Factor Agent
    - factor_evaluation      # S3-3 Eval Agent
    - mode_b_scheduler       # C14 Mode B Scheduler

  # v2.2 추가 — Mode B용 GPT-4o는 별도 예산 (장중 100회와 무관)
  mode_b_gpt4o:
    factor_hypothesis: "unlimited"     # Idea Agent (§8.3)
    factor_implementation: "unlimited" # Factor Agent (§8.3)
    factor_evaluation: "unlimited"     # Eval Agent (§8.3)
    backtest_reasoning: "unlimited"    # Backtest Agent diagnostic_notes (§8.5.2)
    note: "장중 Kanana-o 예산(100회)과 분리. 장마감 18:00~22:00 전용"

# v2.2 추가 — Backtest Agent (C12 BacktestAgentContract)
backtest_agent:
  mode: "mode_b_only"                  # 장중 경로 절대 미개입
  llm: "gpt-4o"                        # Kanana-o 100회 예산 보존
  sla:
    max_runtime_sec: 3600              # 60분
    deadline: "21:30"                  # KST, 22:00 배포 게이트 30분 전
    retry_policy:
      max_retries: 1
      on_retry_fail: "baseline_hold"
  deploy_decision_gate:
    verdict_required: "pass"           # pass | warn | fail
    regression_severity_block: "high"  # low | medium | high
    # SHIP-fix R-2 (W1 P0 cleanup): backtest verdict 임계값. 불변 5원칙 (하드코딩 금지).
    # backtest.py:_calc_verdict 가 참조. SR / IC 기준.
    pass_sr_threshold: 0.0             # SR >= 0.0 AND IC >= 0.0 → "pass"
    pass_ic_threshold: 0.0
    warn_sr_threshold: -0.5            # SR >= -0.5 OR IC >= -0.1 → "warn", 그 외 "fail"
    warn_ic_threshold: -0.1
    # SHIP-fix NEW-1 (2026-05-06): regression_severity 임계값. backtest.py:_calc_regression_severity 가 참조.
    severity_none_sr_threshold: 0.5    # SR >= 0.5 → "none"
    severity_low_sr_threshold: 0.0     # SR >= 0.0 → "low"
    severity_medium_sr_threshold: -0.5 # SR >= -0.5 → "medium", 그 외 "high"
    feature_quality_gate:
      min_dual_source_non_neutral_row_coverage: 0.8
      min_exogenous_non_neutral_row_coverage: 0.8
      missing_feature_quality_action: "block_deploy"
    service_policy_gate:
      require_status: "PASS"
      require_no_naked_short: true
      require_order_caps_respected: true
      require_cash_guard_respected: true
      missing_service_policy_action: "block_deploy"
    final_dataset_gate:
      required: true
      expected_start_date: "20250509"
      expected_end_date: "20260515"
      min_business_days: 249
      min_tickers: 30
      allowed_model_data_source: "artifact_bars"
      allowed_stock_statuses:
        - "active"
      allowed_sector_statuses:
        - "confirmed"
      include_pending_data_tickers: false
      missing_final_dataset_action: "block_deploy"
      rehearsal_business_days: 80
      rationale: "80거래일 수집은 paper/flow rehearsal 전용이다. v1 실계좌 직전 C12/C14/deploy_quality PASS는 KIS retention probe로 확인된 20250509~20260515 30종목 active 1분봉 학습 메타데이터가 있어야만 허용한다. 10년 벤더 데이터는 v2 research 목표로 분리한다."
    on_pass:
      human_approval_required: true
      action: "deploy"
    on_warn:
      human_approval_required: true    # operator 수동 확인
      action: "operator_review"
    on_fail:
      action: "block_deploy"
      baseline_action: "hold"
      log_to: "dead_letter_log"
  forbidden_permissions:
    - target_weights_modification
    - order_deltas_generation
    - fda_bypass
    - hot_path_intervention
    - shared_message_pool_publish_during_market_hours
    - production_direct_write
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.1.0"                  # SHIP-fix R-2 + NEW-1 (2026-05-06): deploy_decision_gate 4 + severity 3 임계값 추가
    last_updated: "2026-05-06"
    updated_by: "w1_p0_cleanup_r2_new1 (2026-05-06)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_only"
    rationale: |
      Backtest Agent 동작 설정. mode/llm/sla/forbidden_permissions/deploy_decision_gate 변경 시
      불변 원칙 3 (Backtest Agent Mode B 전용) + 불변 원칙 5 (하드코딩 금지) 위반 가능. 자동 변경 금지.

# v2.2 추가 — Validation Tools (C13 ValidationToolsContract)
validation_tools:
  called_by: "backtest_agent"          # 유일한 consumer
  backtest_engine:
    sla:
      max_runtime_sec: 1800            # 30분
      max_concurrent: 1
    replay_resolution: "1m"
    # v3 추가 — 분봉 leakage control (S1-0 Batch B 2026-04-20 보정)
    # 이전 값: 390/390 (1거래일 전부 버림, 과도 보수). Sprint 4 pilot 후 재조정 예정.
    # 현재 값: Prado "Advances in Financial Machine Learning" 기준
    #   - purge ≥ label horizon(5m) + feature max lookback(60m multi-scale) → 60
    #   - embargo = test period 1% rule. test 20거래일 × 390분 × 1% ≈ 78
    purge_bars: 60                     # 60 bars = 60분 buffer (label 5m + multi-scale 60m 커버)
    embargo_bars: 78                   # 78 bars ≈ test window 1% (Prado rule of thumb)
    replay_unit: "1m"                  # 분봉 기준. 일봉("1d")에서 전환
    # S3 Critical 8 (2026-05-01): 하드코딩 제거 — _run_single_fold synthetic mock 파라미터
    mock_data:
      base_price: 50000.0              # synthetic 거래 기준가 (KRW)
      price_noise_std: 1000.0          # 가격 노이즈 표준편차 (KRW)
      signal_return_correlation: 0.05  # 예측 시그널과 실제 수익률 상관 계수
      return_noise_std: 0.02           # 실제 수익률 노이즈 표준편차 (비율)
    # DEPRECATED 2026-05-12 (Phase 1 재수정, Codex cross-check):
    # Top-K long-only 산식 (trainer lgbm_trainer._group_for_metrics:401-411 정합) 으로
    # 변경된 후 threshold filter 사용처 없음. 새 산식은 threshold 없이 top-K mean.
    # 참고용으로만 유지. 코드 로드 path는 validation_tools.py:131 에서 제거.
    trade_signal_threshold: 0.03       # DEPRECATED: dead config, 코드 미사용
    errors:
      - BUNDLE_LOAD_FAILED
      - DATA_UNAVAILABLE
      - NAN_IN_METRICS
      - LEAKAGE_DETECTED              # v3 추가 — purge/embargo 위반 시
  replay_runner:
    sla:
      max_runtime_sec: 2400            # 40분
    mode: "deterministic_replay"
    replay_unit: "1m"                  # v3 추가 — 분봉 기준 replay
    idempotent: true
    event_sources:
      - naver_news
      - dart
      - community
      - us_market
      - ecos
      - krx_investor_flow
  performance_analyzer:
    sla:
      max_runtime_sec: 600             # 10분
    ablation_components:
      - factor
      - model
      - allocator
      - dual_source
    regime_labels:
      - bull
      - bear
      - sideways
      - volatile
    # verdict 임계값 (하드코딩 금지 — 코드에서 이 키 로드)
    verdict_improve_sharpe_threshold: 0.1    # delta_sharpe >= +0.1 AND delta_mdd >= 0 → improved
    verdict_degrade_sharpe_threshold: -0.1   # delta_sharpe <= -0.1 → degraded 후보
    verdict_degrade_mdd_threshold: -0.05     # delta_mdd <= -0.05 → degraded 후보
    # regression_risk 임계값
    regression_sharpe_drop_threshold: -0.2   # delta_sharpe < -0.2 → flagged
    regression_mdd_drop_threshold: -0.10     # delta_mdd < -0.10 → flagged
    regression_bear_sharpe_floor: -1.0       # bear/volatile sharpe < -1.0 → flagged
    regression_dual_source_counterproductive: 0.3  # dual_source ablation delta_sharpe > +0.3 → flagged
  result_persistence:
    storage: "kb"
    ttl_days: 30
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-05-01"
    updated_by: "Sprint 3 SHIP (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_only"
    rationale: |
      Validation Tools (BacktestEngine/ReplayRunner/PerformanceAnalyzer) 설정.
      purge_bars/embargo_bars/verdict 임계값 변경 시 C13 SLA 정합성 직결. 자동 변경 금지.

# v2.2 추가 — BacktestEngine 거래비용 모델
execution_cost_model:
  name: "slippage_v1"                  # default. BacktestEngine.input.execution_cost_model 참조
  components:
    commission_bps: 5                  # 체결 수수료 (bps)
    slippage_bps: 10                   # 슬리피지 (bps)
    market_impact_coef: 0.0            # 시장 충격 계수 (현재 미적용)
  note: "BacktestEngine이 walk-forward 시 reward에 반영. 실거래 전환 시 재측정 필수."
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.0.0"
    last_updated: "2026-05-01"
    updated_by: "Sprint 3 SHIP (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 365
    update_trigger: "manual_only"
    rationale: |
      BacktestEngine 거래비용 모델. commission_bps/slippage_bps 변경 시
      walk-forward reward 함수 직접 영향. 실거래 전환 전 재측정 필수. 자동 변경 금지.

# v3 추가 — dual_source (뉴스↔커뮤니티 분리 점수 + divergence)
# 2026-04-21: divergence.tiers 3-tier 추가 (memory project_v3_universe_and_dual_source.md §2)
dual_source:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "2026-04-21"
    last_updated: "2026-04-21T14:00:00+09:00"
    updated_by: "s2_audit_phase_b (elephant-ops)"
    mode_b_editable: false
    human_approval_required: true
    backup_retention_days: 30
    update_trigger: "manual_only"
    rationale: |
      Dual-Source (뉴스↔커뮤니티) divergence 파라미터. Risk Fast sidecar 감지 임계값 +
      FDA uncertainty 연계 계수. 불변 원칙 1~5 중 PIT-Safety + 하드코딩 금지 직결.
  enabled: true
  # S4-2 추가 (2026-05-02): LightGBM 피처 주입 제어 플래그.
  # true = 5피처를 DatasetBuilder 통해 LightGBM 학습에 포함 (baseline_with_dual_source.pkl).
  # false = 기존 4피처만 사용 (baseline.pkl 롤백 경로).
  # 불변 원칙 5: 하드코딩 금지. 코드에서 이 키를 로드해 on/off 분기.
  enabled_for_lgbm: true
  news_decay_lambda: 0.8
  community_decay_lambda: 0.4
  community_peak_lag_days: 2
  divergence_threshold: 0.5          # 기존 hard threshold (penalty 발동 기준)
  divergence_penalty_multiplier: 0.85
  community_noise_zscore: 2.5
  # divergence 3-tier 정책 (Sprint 2 Risk Fast sidecar 로드 대상)
  # PIT-Safety: divergence는 장전 08:00~08:30 배치 점수 기반 → 실시간 미래 참조 없음
  divergence:
    formula: "abs(news_score_t - comm_score_t_1)"
    tiers:
      low:
        max: 0.2
        action: "no_penalty"
        description: "방향 일치, penalty 없음"
      medium:
        min: 0.2
        max: 0.5
        action: "soft_warning"
        description: "FDA audit log 에 warning 기록 (reason_code 후보)"
      high:
        min: 0.5
        action: "uncertainty_penalty"
        description: "강한 불일치 → total_score × penalty_multiplier + sizing 축소 + FDA uncertainty 신호"
  score_build_window:
    start: "08:00"
    end: "08:30"
  usage:
    lightgbm_features: [news_score_t, comm_score_t_1, comm_score_t_2, news_comm_divergence, community_noise_multiplier]
    risk_fast_rule: "divergence > threshold → uncertainty_penalty"
    cold_path_reasoning: true
  models:
    news_classifier: "local_finbert_or_equivalent"
    community_scorer: "spam_rules + manipulation_rules + sentiment_dict + optional_small_model"
  ablation:
    required_in_backtest: true
    compare: [with_dual_source, without_dual_source]

# v3 추가 — trigger_catalog (Risk Agent Fast Path + Event Admission 공용)
# {trigger → action} 매핑. 단순 threshold가 아니라 조건 → 행동 구조.
# Mode B 야간 갱신 대상 (§8.7 ⑨). 하드코딩 금지 원칙 — 이 섹션에서만 정의.
trigger_catalog:
  mode_b_metadata:
    schema_version: "1.0.0"
    data_version: "1.1.0"
    last_updated: "2026-05-03"
    updated_by: "s5_p4_admission_rules"
    mode_b_editable: true
    human_approval_required: false
    backup_retention_days: 30
    update_trigger: "mode_b_nightly"
    update_source: "어제 False Positive 높았던 rule 임계값 조정 (architecture.md §8.7 ⑨)"
    rationale: "trigger_catalog 는 Risk Fast sidecar + EventAdmission 공용 규칙. rule id/action 신규 추가는 파이프라인 전체에 영향. update_source 는 Mode B §8.5.1 야간 키워드 진화로 자동 갱신 대상이나, rule 구조 변경은 operator 수동 승인."

  rules:
    - id: "comm_volume_spike"
      condition: "comm_volume z-score > 2.5"
      priority: "normal"
      action: "review_risk"
      risk_level: "medium"
      stance: "risk_reduce"
      description: "커뮤니티 게시글 급증 → Risk Agent에 리스크 검토 요청"

    - id: "comm_sentiment_delta"
      condition: "sentiment_score 30분 변화율 > 0.5"
      priority: "normal"
      action: "review_risk"
      risk_level: "medium"
      stance: "risk_reduce"
      description: "커뮤니티 감성 급변 → Risk Agent에 감성 변화 원인 분석 요청"

    - id: "intraday_drop_anomaly"
      condition: "1min return < -3σ (rolling 60분 기준)"
      priority: "urgent"
      action: "tighten_stop"
      risk_level: "high"
      stance: "veto_recommendation"
      description: "분봉 급락 이상치 → stop-loss 긴축 + Cold Path 진입"

    - id: "foreign_net_sell_critical"
      condition: "foreign_net_sell > 100B KRW (종목별 또는 시장 전체)"
      priority: "urgent"
      action: "reduce_new_entries"
      risk_level: "high"
      stance: "veto_recommendation"
      description: "외국인 대규모 순매도 → 신규 진입 축소"

    - id: "dart_critical_disclosure"
      condition: "dart_rules.yaml critical 매칭"
      priority: "urgent"
      action: "cold_path_escalate"
      risk_level: "high"
      stance: "veto_recommendation"
      description: "중요 공시 → 즉시 Cold Path 에스컬레이션"

    # 2026-04-21 추가: memory project_v3_universe_and_dual_source.md §2
    # PIT-Safety: divergence 계산은 장전 배치(08:00~08:30) 점수 기반 → 미래 참조 없음
    - id: "news_comm_divergence_strong"
      condition: "abs(news_score_t - comm_score_t_1) > 0.5"
      priority: "normal"
      action: "uncertainty_penalty"
      risk_level: "medium"
      stance: "risk_reduce"
      description: "뉴스↔커뮤니티 방향 불일치 심각. position sizing 축소 + FDA uncertainty_score 상승 신호. memory project_v3_universe_and_dual_source.md §2."
      publishes_to: "uncertainty_signal"

    # Sprint 5 — Dynamic Universe 편입 트리거
    # action: admit_candidate 가 신규 행동. AdmissionEngine 이 처리.
    - id: "price_spike_admission"
      condition: "watch_universe ticker 1min return > +5% OR < -5%"
      priority: "urgent"
      action: "admit_candidate"
      risk_level: "medium"
      stance: "opportunity"
      description: "watch universe (KOSPI200) 종목 ±5% 급변 → dynamic_candidate_pool 편입 후보. AdmissionEngine 이 max_size=10 가드 적용."
      publishes_to: "admission_event"

    - id: "dart_hot_ticker_admission"
      condition: "dart 공시 + watch universe ticker AND dart_rules.yaml material 매칭"
      priority: "urgent"
      action: "admit_candidate"
      risk_level: "medium"
      stance: "opportunity"
      description: "watch universe 종목의 중요 공시 → dynamic_candidate_pool 편입 후보. trade universe 종목은 별도 (Cold Path 처리)."
      publishes_to: "admission_event"


