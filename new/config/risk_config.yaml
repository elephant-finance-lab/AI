# S1-0 추가 — Preprocessor 설정 (C3 PreprocessingContract)
# preprocessor.py + dataset_builder.py가 참조. architecture.md §2.3 ①②③ 단계 파라미터.
preprocessor:
  multi_scale_windows: [1, 5, 30, 60]
  intraday_feature_windows: [30, 60, 120, 195]
  volume_z_windows: [30, 195]
  mad_constant: 1.4826          # MAD → 표준편차 근사 상수 (정규분포 가정)
  outlier_cap_z: 5.0            # |z| > 5 clip
  missing_policy: "forward_fill_then_cross_mean"
  rolling_min_periods: 5        # rolling window 유효 bar 수 (30m 기준)
  # S1-0 Batch C 추가 (2026-04-20): LGBMTrainer/DatasetBuilder 공용 피처 목록
  # DatasetBuilder._compute_rolling_features 출력과 1:1 대응.
  # 피처 추가/제거 시 이 목록 + dataset_builder 양쪽 동시 수정 필수.
  # S4-2 추가 (2026-05-02): dual_source 5피처 포함 여부는 dual_source.enabled_for_lgbm 플래그로 제어.
  # dual_source.enabled_for_lgbm=true 시 아래 5피처를 feature_cols에 병합.
  # 이 목록은 base 피처 (항상 포함).
  feature_cols:
